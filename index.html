<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F2" />
    <meta name="description" content="Track your drinks month by month. One page, no login." />
    <title>Khon Mao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      // Paint the saved theme before React loads (no flash).
      (function () {
        try {
          // "khon-mao:theme" (migrated once from the old "drink-tracker:theme" key).
          var ok = function (v) { return v === "light" || v === "dark" || v === "system"; };
          var p = localStorage.getItem("khon-mao:theme");
          if (!ok(p)) {
            var old = localStorage.getItem("drink-tracker:theme");
            p = ok(old) ? old : "system";
            if (ok(old)) localStorage.setItem("khon-mao:theme", old);
          }
          var host = document.documentElement.getAttribute("data-theme");
          var sys = host ? host === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (p === "dark" || (p === "system" && sys)) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
