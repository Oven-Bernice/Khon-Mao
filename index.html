    <script>
      // Paint the saved theme before React loads (no flash).
      (function () {
        try {
          // "khon-mao:theme" (migrated once from the old "drink-tracker:theme" key).
          var ok = function (v) { return v === "light" || v === "dark" || v === "system"; };
          var p = localStorage.getItem("khon-mao:theme");
          if (!ok(p)) {
            var old = localStorage.getItem("drink-tracker:theme");
            p = ok(old) ? old : "system";
            if (ok(old)) localStorage.setItem("khon-mao:theme", old);
          }
          var host = document.documentElement.getAttribute("data-theme");
          var sys = host ? host === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (p === "dark" || (p === "system" && sys)) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

-and-fact-sheets/truth-about-holiday-spirits"},niaaaBinge:{label:"NIAAA — Binge drinking",url:"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/binge-drinking"},niaaaOverdose:{label:"NIAAA — Understanding the dangers of alcohol overdose",url:"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/understanding-dangers-of-alcohol-overdose"},niaaaMeds:{label:"NIAAA — Harmful interactions: mixing alcohol with medicines",url:"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/harmful-interactions-mixing-alcohol-with-medicines"},niaaaTips:{label:"NIAAA Rethinking Drinking — Tips to try",url:"https://rethinkingdrinking.niaaa.nih.gov/thinking-about-change/tips-try"},cdcHealth:{label:"CDC — Alcohol use and your health",url:"https://www.cdc.gov/alcohol/about-alcohol-use/index.html"},cdcCancer:{label:"CDC — Alcohol and cancer",url:"https://www.cdc.gov/cancer/risk-factors/alcohol.html"},nci:{label:"National Cancer Institute — Alcohol and cancer risk",url:"https://www.cancer.gov/about-cancer/causes-prevention/risk/alcohol/alcohol-fact-sheet"},who:{label:"WHO — Alcohol fact sheet",url:"https://www.who.int/news-room/fact-sheets/detail/alcohol"},whoNoSafe:{label:"WHO Europe — No level of alcohol consumption is safe for our health",url:"https://www.who.int/europe/news/item/04-01-2023-no-level-of-alcohol-consumption-is-safe-for-our-health"},dga:{label:"Dietary Guidelines for Americans",url:"https://www.dietaryguidelines.gov/"}},Rl=[{id:"basics",icon:"🧠",title:"Alcohol basics",description:"What alcohol is, and how it's measured."},{id:"drink",icon:"🍺",title:"Know your drink",description:"Standard drinks, ABV, food and water."},{id:"body",icon:"🫀",title:"Alcohol & your body",description:"How alcohol can affect brain, heart, sleep and more."},{id:"risks",icon:"⚠️",title:"Know the risks",description:"Short-term risks, binge drinking and overdose signs."},{id:"myths",icon:"🧩",title:"Myth vs fact",description:"Tap a myth to see what the evidence says."},{id:"less",icon:"🌱",title:"Drinking less",description:"Practical, realistic ways to lower your risk."}],Yp={title:"The simple takeaway",text:"There is no completely risk-free level of alcohol use. In general, the less alcohol you drink, the lower your alcohol-related health risk."},ad=[{id:"what-is-alcohol",category:"basics",icon:"🧪",title:"What is alcohol?",summary:"The same molecule is in beer, wine and spirits.",blocks:[{t:"p",text:"The alcohol in drinks is ethanol. It's made when yeast ferments sugars — in grain for beer, grapes for wine — and can be concentrated further by distilling, as in spirits."},{t:"callout",tone:"info",title:"Same alcohol, different drinks",text:"Beer, wine and spirits all contain the same ethanol. What differs is how much of it is in each drink."},{t:"points",items:[{icon:"🫀",text:"Your liver breaks down most of the alcohol you drink."},{icon:"⏳",text:"It does this at its own pace — only time lets your body process alcohol."},{icon:"🧠",text:"Until then, alcohol keeps affecting your brain and body."}]}],sources:[be.niaaaBody,be.niaaaHoliday]},{id:"abv",category:"basics",icon:"🏷️",title:"What ABV means",summary:"The % on the label tells you how strong a drink is.",blocks:[{t:"p",text:"ABV tells you how much of a drink is alcohol by volume. A 5% beer is 5% alcohol; a 40% spirit is 40% alcohol."},{t:"points",items:[{icon:"🍺",text:"Regular beer is often around 4–6% ABV; some craft beers are 8% or more."},{icon:"🍷",text:"Wine is often around 11–14% ABV."},{icon:"🥃",text:"Distilled spirits are often around 40% ABV."}]},{t:"callout",tone:"key",title:"Bigger or stronger = more alcohol",text:"A larger drink or a stronger drink can contain more alcohol, even if it looks like just one drink."}],sources:[be.niaaaStd]},{id:"serving-vs-alcohol",category:"basics",icon:"⚖️",title:"Serving size ≠ alcohol amount",summary:"One glass isn't automatically one drink.",blocks:[{t:"p",text:"How much alcohol you actually have depends on three things together:"},{t:"points",items:[{icon:"📏",text:"Volume — how much is in the glass, can or bottle."},{icon:"🏷️",text:"ABV — how strong it is."},{icon:"🍹",text:"Type of drink — mixed drinks and cocktails can contain more than one shot of spirits."}]},{t:"callout",tone:"info",title:"Example",text:"A 640 mL bottle of 5% beer contains about 1.8 U.S. standard drinks — almost twice the alcohol of a 355 mL can."},{t:"p",text:"That's why counting “glasses” or “bottles” can underestimate how much alcohol you've had."}],sources:[be.niaaaStd,be.cdcStd]},{id:"standard-drink",category:"drink",icon:"🥛",title:"What is a standard drink?",summary:"A U.S. measurement reference: about 14 g of pure alcohol.",blocks:[{t:"p",text:"In the United States, 1 standard drink contains about 14 grams of pure alcohol. Other countries use different definitions."},{t:"drinks"},{t:"p",text:"These examples contain approximately the same amount of pure alcohol, even though the serving sizes are different."},{t:"callout",tone:"key",title:"Standard drink ≠ serving size",text:"A single real-world serving may contain more than one U.S. standard drink. A 12 oz beer at 10% ABV contains about twice the alcohol of a 12 oz beer at 5% ABV."},{t:"callout",tone:"info",title:"A measurement — not a limit",text:"A standard drink is only a way to compare alcohol amounts. It isn't a safe or recommended amount."}],sources:[be.niaaaStd,be.cdcStd]},{id:"calculator",category:"drink",icon:"🧮",title:"Alcohol calculator",summary:"Estimate pure alcohol and U.S. standard drinks.",blocks:[{t:"calculator"},{t:"more",title:"How it's calculated",blocks:[{t:"p",text:"Pure alcohol (g) ≈ volume (mL) × ABV × 0.789 — the density of ethanol."},{t:"p",text:"Approximate U.S. standard drinks ≈ pure alcohol (g) ÷ 14."},{t:"p",text:"Example: 330 mL × 0.05 × 0.789 ≈ 13 g of pure alcohol."}]}],sources:[be.niaaaStd]},{id:"food",category:"drink",icon:"🍽️",title:"Food & alcohol",summary:"Food slows absorption — it doesn't sober you up.",blocks:[{t:"p",text:"Eating can slow alcohol absorption and may reduce the peak alcohol level in the blood."},{t:"callout",tone:"key",title:"But food doesn't make alcohol leave faster",text:"Food does not make alcohol leave your body faster, and it doesn't remove alcohol's health risks."}],sources:[be.niaaaHoliday]},{id:"water",category:"drink",icon:"💧",title:"Water & alcohol",summary:"Good for hydration — not a shortcut to sober.",blocks:[{t:"p",text:"Water or other alcohol-free drinks can help with hydration, and alternating them with alcoholic drinks can slow your pace."},{t:"callout",tone:"key",title:"Time is what sobers you up",text:"Water does not speed up alcohol metabolism or make you sober faster. Your body needs time to process alcohol."}],sources:[be.niaaaHoliday,be.niaaaTips]},{id:"brain",category:"body",icon:"🧠",title:"Brain",summary:"Judgment, coordination, reaction time and memory.",blocks:[{t:"p",text:"Alcohol affects the brain and nervous system. It can impair judgment, coordination, reaction time and memory, especially as the amount consumed increases."},{t:"p",text:"It interferes with the brain's communication pathways, which can change mood and behavior."}],sources:[be.niaaaBody]},{id:"heart",category:"body",icon:"❤️",title:"Heart & circulation",summary:"Blood pressure, heart rhythm and heart muscle.",blocks:[{t:"p",text:"Alcohol use can increase the risk of cardiovascular problems, particularly with heavier or long-term drinking."},{t:"points",items:[{icon:"📈",text:"High blood pressure"},{icon:"💓",text:"Irregular heartbeat"},{icon:"🫀",text:"Weakening of the heart muscle (cardiomyopathy) with long-term heavy drinking"},{icon:"🧠",text:"Higher stroke risk"}]}],sources:[be.niaaaBody]},{id:"liver",category:"body",icon:"🫀",title:"Liver",summary:"The organ that breaks down most alcohol.",blocks:[{t:"p",text:"The liver breaks down most alcohol. Repeated heavy drinking can damage the liver and increase the risk of liver disease."},{t:"p",text:"Alcohol-related liver problems include fatty liver, inflammation (alcoholic hepatitis), scarring (fibrosis and cirrhosis) and liver cancer."}],sources:[be.niaaaBody]},{id:"sleep",category:"body",icon:"😴",title:"Sleep",summary:"Falling asleep isn't the same as sleeping well.",blocks:[{t:"p",text:"Alcohol can change normal sleep patterns and may worsen sleep quality or sleep problems."},{t:"p",text:"Even moderate amounts may alter how sleep works — for example, by shortening REM sleep."}],sources:[be.niaaaMental]},{id:"cancer",category:"body",icon:"🧬",title:"Alcohol & cancer",summary:"All alcoholic drinks can increase cancer risk.",blocks:[{t:"callout",tone:"key",title:"Alcohol increases the risk of several types of cancer",text:"All alcoholic beverages can increase cancer risk — beer, wine and spirits."},{t:"points",items:[{icon:"•",text:"Mouth and throat, voice box (larynx) and esophagus"},{icon:"•",text:"Liver"},{icon:"•",text:"Breast"},{icon:"•",text:"Colon and rectum"}]},{t:"p",text:"The risk generally increases as alcohol exposure increases. Even lower levels of drinking are associated with a higher risk of some cancers, such as breast cancer."},{t:"callout",tone:"info",title:"Less is lower",text:"Drinking less alcohol lowers alcohol-related cancer risk."}],sources:[be.cdcCancer,be.nci,be.who]},{id:"mental-health",category:"body",icon:"🧘",title:"Mental health",summary:"Mood, anxiety, depression and sleep are connected.",blocks:[{t:"p",text:"Alcohol can affect mood and mental health. Heavy or repeated drinking can be associated with anxiety, depression, sleep problems and other mental health difficulties."},{t:"p",text:"These links run in both directions and differ from person to person — drinking doesn't automatically cause a mental health condition, but it can contribute to one or make it harder to manage."},{t:"callout",tone:"info",title:"Support is available",text:"If you're struggling, talking to someone you trust or a health professional can help."}],sources:[be.niaaaMental,be.who]},{id:"takeaway",category:"risks",icon:"🌱",title:"The simple takeaway",summary:"Less alcohol generally means lower risk.",blocks:[{t:"callout",tone:"key",title:"No completely risk-free level",text:"There is no completely risk-free level of alcohol use. In general, the less alcohol you drink, the lower your alcohol-related health risk."},{t:"p",text:"This isn't about judging anyone. It's a way to understand risk — so you can make choices that fit your life."}],sources:[be.whoNoSafe,be.who]},{id:"moderate",category:"risks",icon:"📏",title:"Moderate ≠ risk-free",summary:"What “moderate drinking” does — and doesn't — mean.",blocks:[{t:"callout",tone:"key",title:"Moderate drinking does not mean risk-free drinking",text:"Even relatively low levels of alcohol use can carry some health risks, including certain cancer risks."},{t:"more",title:"U.S. guidance",blocks:[{t:"p",text:"The 2020–2025 Dietary Guidelines for Americans described moderate drinking, for adults who choose to drink, as 2 drinks or less in a day for men and 1 drink or less for women."},{t:"p",text:"The 2025–2030 edition advises adults to consume less alcohol for better overall health."},{t:"p",text:"This is U.S. guidance, not a global safe limit — other countries use different advice."}]},{t:"p",text:"People who don't drink aren't advised to start drinking for any supposed health benefit."}],sources:[be.dga,be.cdcHealth,be.who]},{id:"binge",category:"risks",icon:"⏱️",title:"What is binge drinking?",summary:"A research definition — not a target or a limit.",blocks:[{t:"callout",tone:"info",title:"U.S. NIAAA definition",text:"For a typical adult, binge drinking is a pattern of drinking that brings blood alcohol concentration (BAC) to 0.08% or higher. This typically corresponds to about 5 or more drinks for men or 4 or more drinks for women in about 2 hours."},{t:"p",text:"This is a public-health and research definition. It is not a recommended amount, a safe limit or a goal — risk is present below it too."},{t:"p",text:"Risk varies between people depending on body size, sex, food intake, medications, how fast someone drinks and other circumstances."}],sources:[be.niaaaBinge,be.niaaaOverdose]},{id:"short-term",category:"risks",icon:"🚦",title:"Short-term effects",summary:"What drinking too much, too fast can lead to.",blocks:[{t:"p",text:"Drinking too much — especially quickly — can increase the risk of:"},{t:"points",items:[{icon:"🤔",text:"Poor judgment"},{icon:"🦶",text:"Reduced coordination and slower reaction time"},{icon:"🩹",text:"Falls and injuries"},{icon:"🚗",text:"Car crashes"},{icon:"✋",text:"Violence"},{icon:"💬",text:"Risky sexual behavior"},{icon:"⚠️",text:"Alcohol poisoning (overdose)"}]}],sources:[be.cdcHealth,be.who]},{id:"overdose",category:"risks",icon:"🚨",title:"Alcohol overdose",summary:"Warning signs, and what to do.",urgent:!0,blocks:[{t:"p",text:"Consuming too much alcohol too quickly can become life-threatening. Blood alcohol can keep rising even after someone stops drinking or falls asleep."},{t:"points",items:[{icon:"😶",text:"Cannot be awakened, or has trouble staying conscious"},{icon:"😵",text:"Severe confusion"},{icon:"🤢",text:"Vomiting"},{icon:"⚡",text:"Seizures"},{icon:"🫁",text:"Slow or irregular breathing"},{icon:"🥶",text:"Pale, blue or unusually cold skin"}]},{t:"callout",tone:"warn",title:"Get help right away",text:"If you suspect an alcohol overdose, seek emergency medical help immediately. Someone doesn't need to show every sign — one is enough to call."},{t:"emergency"},{t:"p",text:"Don't leave the person to “sleep it off.” Coffee, cold showers or walking do not reverse an overdose. Stay with them and keep them on their side if they're lying down."}],sources:[be.niaaaOverdose]},{id:"medication",category:"risks",icon:"💊",title:"Alcohol + medication",summary:"Some medicines and alcohol don't mix.",blocks:[{t:"p",text:"Alcohol can interact with some medicines and may increase side effects or health risks — including some over-the-counter and herbal products."},{t:"callout",tone:"key",title:"Spacing them apart isn't a fix",text:"Spacing them apart does not necessarily prevent an interaction."},{t:"p",text:"Check the medicine label, ask a pharmacist, or speak with a healthcare professional if you are unsure."}],sources:[be.niaaaMeds]},{id:"tips",category:"less",icon:"🧭",title:"Ways to drink less",summary:"Small, realistic steps — pick two or three to try.",blocks:[{t:"p",text:"These steps may help reduce alcohol-related risk:"},{t:"points",items:[{icon:"🎯",text:"Set a personal intention before drinking"},{icon:"🔁",text:"Alternate alcoholic drinks with alcohol-free drinks"},{icon:"🍽️",text:"Eat before or while drinking"},{icon:"🥂",text:"Choose smaller servings and pay attention to ABV"},{icon:"📊",text:"Track how much you drink"},{icon:"🌱",text:"Have alcohol-free days"},{icon:"🐢",text:"Slow down"},{icon:"🚗",text:"Don't drink and drive — plan transportation before drinking"},{icon:"💊",text:"Check whether your medicines interact with alcohol"},{icon:"🔍",text:"Notice patterns rather than judging yourself"}]}],sources:[be.niaaaTips]},{id:"alcohol-free-days",category:"less",icon:"🌱",title:"Alcohol-free days",summary:"A simple way to lower overall alcohol exposure.",blocks:[{t:"p",text:"Having days when you do not drink can reduce your overall alcohol exposure and can be a practical way to drink less."},{t:"p",text:"There isn't a number of alcohol-free days that makes drinking safe — the point is awareness and lower overall exposure."},{t:"callout",tone:"info",title:"In Khon Mao",text:"Mark a day as alcohol-free on Home to see it in your calendar and alcohol-free streak."}],sources:[be.niaaaTips,be.who]}],ti=[{id:"wine",myth:"Wine is safer than beer or spirits.",fact:"All alcoholic beverages contain alcohol, and alcohol itself contributes to health risks."},{id:"water",myth:"Water makes you sober faster.",fact:"Water can help with hydration, but it does not speed up alcohol metabolism."},{id:"food",myth:"Eating makes
